<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form.css">
</head>
<body>

<div class="tab-container">
    <div class="tab-header">
        <button class="tab-link active" data-tab="one-way">One Way</button>
        <button class="tab-link" data-tab="out-station">Out Station</button>
        <button class="tab-link" data-tab="rental">Rental</button>
        <button class="tab-link" data-tab="airport">Airport</button>
    </div>
    <div class="tab-content active" id="one-way">
        <div class="form-group">
            <label for="pickup">Pickup Location</label>
            <input type="text" id="pickup" placeholder="Enter pickup location">
        </div>
        <div class="form-group">
            <label for="drop">Drop Location</label>
            <input type="text" id="drop" placeholder="Enter drop location">
        </div>

        <div class="form-group">
            <div class="time">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>
            <div class="time">
                <label for="">Time</label>
                <input type="time" id="time">
            </div>
            
        </div>

        <button class="submit-btn">Submit</button>
    </div>
    <div class="tab-content" id="out-station">
        <div class="form-group">
            <label for="from">From</label>
            <input type="text" id="from" placeholder="Enter starting point">
        </div>
        <div class="form-group">
            <label for="to">To</label>
            <input type="text" id="to" placeholder="Enter destination">
        </div>
        <button class="submit-btn">Submit</button>
    </div>
    <div class="tab-content" id="rental">
        <div class="form-group">
            <label for="duration">Rental Duration (hrs)</label>
            <input type="number" id="duration" placeholder="Enter rental duration">
        </div>
        <div class="form-group">
            <label for="vehicle">Vehicle Type</label>
            <select id="vehicle">
                <option value="car">Car</option>
                <option value="bike">Bike</option>
                <option value="van">Van</option>
            </select>
        </div>
        <button class="submit-btn">Submit</button>
    </div>
    <div class="tab-content" id="airport">
        <div class="form-group">
            <label for="flight">Flight Number</label>
            <input type="text" id="flight" placeholder="Enter flight number">
        </div>
        <div class="form-group">
            <label for="terminal">Terminal</label>
            <input type="text" id="terminal" placeholder="Enter terminal">
        </div>
        <button class="submit-btn">Submit</button>
    </div>
</div>

<script>
    const tabLinks = document.querySelectorAll('.tab-link');
    const tabContents = document.querySelectorAll('.tab-content');

    tabLinks.forEach(link => {
        link.addEventListener('click', () => {
            // Remove active class from all buttons and contents
            tabLinks.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));

            // Add active class to the clicked button and corresponding content
            link.classList.add('active');
            document.getElementById(link.getAttribute('data-tab')).classList.add('active');
        });
    });
</script>

</body>
</html>
